x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    env_file:
      - .env.development
    ports:
      - "5432:5432"

  redis:
    ports:
      - "6379:6379"

  postgres-backup:
    env_file:
      - .env.development
    environment:
      POSTGRES_HOST: postgres
      BACKUP_DIR: /backups

  api:
    container_name: expentra-api
    image: ${IMAGE_NAME}
    build:
      context: ../..
      dockerfile: Dockerfile
      target: deps
    working_dir: /app
    command: pnpm run start:dev
    restart: unless-stopped
    stop_grace_period: 30s
    logging: *default-logging
    env_file:
      - .env.development
    environment:
      APP_ROLE: api
      RUN_MIGRATIONS: "true"
      RUN_SEED: "false"
    expose:
      - "3200"
    volumes:
      - ../..:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://api:3200/api/health/live').then(()=>process.exit(0)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - backend

  worker:
    container_name: expentra-worker
    image: ${IMAGE_NAME}
    build:
      context: ../..
      dockerfile: Dockerfile
      target: deps
    working_dir: /app
    command: pnpm run start:worker:dev
    restart: unless-stopped
    stop_grace_period: 30s
    logging: *default-logging
    env_file:
      - .env.development
    environment:
      APP_ROLE: worker
      RUN_MIGRATIONS: "false"
      RUN_SEED: "false"
    volumes:
      - ../..:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      disable: true
    networks:
      - backend
