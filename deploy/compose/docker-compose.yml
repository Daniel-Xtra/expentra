name: expentra

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

networks:
  backend:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  postgres_backups:

services:
  postgres:
    image: postgres:15-alpine
    container_name: expentra-postgres
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend

  redis:
    image: redis:7-alpine
    container_name: expentra-redis
    restart: unless-stopped
    logging: *default-logging
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - backend

  postgres-backup:
    image: postgres:15-alpine
    container_name: expentra-postgres-backup
    restart: unless-stopped
    logging: *default-logging
    volumes:
      # Host: <deploy-root>/scripts/backup (synced by CI from deploy/scripts/backup)
      - ../scripts/backup:/backup:ro
      - postgres_backups:/backups
    entrypoint: ["/bin/sh", "-c"]
    command: |
      set -eu
      echo "[backup-init] Checking /backup scripts..."
      ls -la /backup || true
      for f in entrypoint.sh backup.sh restore.sh; do
        if [ ! -s "/backup/$$f" ]; then
          echo "[backup-init] ERROR: /backup/$$f is missing or empty." >&2
          echo "[backup-init] On the VPS, ensure CI synced deploy/scripts/backup → scripts/backup" >&2
          exit 1
        fi
      done
      mkdir -p /runtime
      for f in entrypoint.sh backup.sh restore.sh; do
        sed 's/\r$$//' "/backup/$$f" > "/runtime/$$f"
        chmod +x "/runtime/$$f"
      done
      exec /bin/sh /runtime/entrypoint.sh
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend
