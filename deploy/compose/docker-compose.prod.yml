x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    env_file:
      - ../env/.env.production

  postgres-backup:
    env_file:
      - ../env/.env.production
    environment:
      POSTGRES_HOST: postgres
      BACKUP_DIR: /backups

  api:
    container_name: expentra-api
    image: ${IMAGE_NAME}
    pull_policy: always
    restart: unless-stopped
    stop_grace_period: 30s
    logging: *default-logging
    env_file:
      - ../env/.env.production
    environment:
      APP_ROLE: api
      RUN_MIGRATIONS: "false"
      RUN_SEED: "false"
    expose:
      - "3200"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3200/api/health/live').then(()=>process.exit(0)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - backend

  migrate:
    container_name: expentra-migrate
    image: ${IMAGE_NAME}
    pull_policy: always
    restart: "no"
    logging: *default-logging
    env_file:
      - ../env/.env.production
    environment:
      APP_ROLE: migrate
      RUN_MIGRATIONS: "true"
      RUN_SEED: "false"
    entrypoint: ["/usr/bin/tini", "--", "sh", "/app/scripts/docker-migrate.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend

  worker:
    container_name: expentra-worker
    image: ${IMAGE_NAME}
    pull_policy: always
    restart: unless-stopped
    stop_grace_period: 30s
    logging: *default-logging
    command: ["node", "dist/worker.js"]
    env_file:
      - ../env/.env.production
    environment:
      APP_ROLE: worker
      RUN_MIGRATIONS: "false"
      RUN_SEED: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      disable: true
    networks:
      - backend
