name: Deploy Staging

on:
  push:
    branches:
      - staging
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read

env:
  COMPOSE_OVERRIDE: docker-compose.staging.yml
  ENV_FILE: .env.staging
  HEALTH_READY_URL: http://127.0.0.1:3200/api/health/ready

jobs:
  build-and-push:
    name: Build and push image
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 30
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Image name (immutable SHA tag)
        id: meta
        env:
          IMAGE_REPOSITORY_SECRET: ${{ secrets.DOCKERHUB_IMAGE }}
          IMAGE_REPOSITORY_VAR: ${{ vars.DOCKERHUB_IMAGE }}
        run: |
          REPO="${IMAGE_REPOSITORY_SECRET:-$IMAGE_REPOSITORY_VAR}"
          if [ -z "${REPO}" ]; then
            echo "::error::Set DOCKERHUB_IMAGE as an Environment variable (recommended) or secret (e.g. youruser/expentra)"
            exit 1
          fi
          SHA_TAG="sha-${GITHUB_SHA}"
          echo "repo=${REPO}" >> "$GITHUB_OUTPUT"
          echo "tag=${SHA_TAG}" >> "$GITHUB_OUTPUT"
          echo "image=${REPO}:${SHA_TAG}" >> "$GITHUB_OUTPUT"
          echo "Building: ${REPO}:${SHA_TAG}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}
            ${{ steps.meta.outputs.repo }}:staging
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to VPS
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Decode ENV_FILE_B64 and set IMAGE_NAME
        id: image
        env:
          ENV_FILE_B64: ${{ secrets.ENV_FILE_B64 }}
          IMAGE_REPOSITORY_SECRET: ${{ secrets.DOCKERHUB_IMAGE }}
          IMAGE_REPOSITORY_VAR: ${{ vars.DOCKERHUB_IMAGE }}
        run: |
          if [ -z "${ENV_FILE_B64}" ]; then
            echo "::error::Missing environment secret ENV_FILE_B64 (base64-encoded .env file)"
            exit 1
          fi
          # Reconstruct here — job outputs that include secret values are redacted/empty.
          REPO="${IMAGE_REPOSITORY_SECRET:-$IMAGE_REPOSITORY_VAR}"
          IMAGE_NAME="${REPO}:sha-${GITHUB_SHA}"
          if [ -z "${REPO}" ]; then
            echo "::error::DOCKERHUB_IMAGE is empty. Add it under Environment → Variables (preferred) or Secrets."
            exit 1
          fi
          printf '%s' "${ENV_FILE_B64}" | base64 -d | tr -d '\r' > /tmp/expentra.env
          grep -qE '^[A-Za-z_][A-Za-z0-9_]*=' /tmp/expentra.env || {
            echo "::error::Decoded environment file is invalid."
            exit 1
          }
          if grep -qE '^IMAGE_NAME=' /tmp/expentra.env; then
            sed -i "s|^IMAGE_NAME=.*|IMAGE_NAME=${IMAGE_NAME}|" /tmp/expentra.env
          else
            printf '\nIMAGE_NAME=%s\n' "${IMAGE_NAME}" >> /tmp/expentra.env
          fi
          grep -qE "^IMAGE_NAME=${IMAGE_NAME}$" /tmp/expentra.env
          echo "image=${IMAGE_NAME}" >> "$GITHUB_OUTPUT"
          echo "Deploy image: ${IMAGE_NAME}"

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Configure pinned known_hosts
        env:
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          if [ -z "${VPS_KNOWN_HOSTS}" ]; then
            echo "::error::Missing environment secret VPS_KNOWN_HOSTS (pinned ssh-keyscan output)"
            exit 1
          fi
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${VPS_KNOWN_HOSTS}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          printf '%s\n' \
            'Host *' \
            '  StrictHostKeyChecking yes' \
            '  UserKnownHostsFile ~/.ssh/known_hosts' \
            > ~/.ssh/config
          chmod 600 ~/.ssh/config

      - name: Capture previous IMAGE_NAME for rollback
        id: previous
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          PREV="$(ssh "${VPS_USER}@${VPS_HOST}" \
            "grep -E '^IMAGE_NAME=' '/opt/expentra-staging/env/${ENV_FILE}' 2>/dev/null | cut -d= -f2- || true")"
          echo "image=${PREV}" >> "$GITHUB_OUTPUT"
          echo "Previous IMAGE_NAME=${PREV:-<none>}"

      - name: Sync deploy files and env to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh "${VPS_USER}@${VPS_HOST}" "mkdir -p '/opt/expentra-staging/compose' '/opt/expentra-staging/env' '/opt/expentra-staging/scripts'"
          rsync -az --delete \
            deploy/compose/ \
            "${VPS_USER}@${VPS_HOST}:/opt/expentra-staging/compose/"
          rsync -az --delete \
            deploy/scripts/ \
            "${VPS_USER}@${VPS_HOST}:/opt/expentra-staging/scripts/"
          scp /tmp/expentra.env "${VPS_USER}@${VPS_HOST}:/opt/expentra-staging/env/${ENV_FILE}"
          ssh "${VPS_USER}@${VPS_HOST}" \
            "chmod 600 '/opt/expentra-staging/env/${ENV_FILE}'"

      - name: Pull, migrate, restart, verify health (rollback on failure)
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          PREVIOUS_IMAGE: ${{ steps.previous.outputs.image }}
          NEW_IMAGE: ${{ steps.image.outputs.image }}
        run: |
          ssh "${VPS_USER}@${VPS_HOST}" \
            COMPOSE_OVERRIDE="$COMPOSE_OVERRIDE" \
            ENV_FILE="$ENV_FILE" \
            HEALTH_READY_URL="$HEALTH_READY_URL" \
            DOCKERHUB_USERNAME="$DOCKERHUB_USERNAME" \
            DOCKERHUB_TOKEN="$DOCKERHUB_TOKEN" \
            PREVIOUS_IMAGE="$PREVIOUS_IMAGE" \
            NEW_IMAGE="$NEW_IMAGE" \
            'bash -s' <<'REMOTE'
          set -euo pipefail

          if [ -z "${NEW_IMAGE}" ]; then
            echo "::error::NEW_IMAGE is empty — cannot deploy"
            exit 1
          fi

          echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
          cd /opt/expentra-staging/compose
          ENV_PATH="../env/${ENV_FILE}"

          # Compose interpolates ${IMAGE_NAME} from the process environment (and --env-file).
          # Exporting avoids "worker has neither an image nor a build context" when the
          # env file alone is not picked up for interpolation.
          export IMAGE_NAME="${NEW_IMAGE}"
          if grep -qE '^IMAGE_NAME=' "${ENV_PATH}"; then
            sed -i "s|^IMAGE_NAME=.*|IMAGE_NAME=${IMAGE_NAME}|" "${ENV_PATH}"
          else
            printf '\nIMAGE_NAME=%s\n' "${IMAGE_NAME}" >> "${ENV_PATH}"
          fi
          # Tiny project .env so Compose always interpolates (in addition to shell export).
          printf 'IMAGE_NAME=%s\n' "${IMAGE_NAME}" > .env
          chmod 600 .env "${ENV_PATH}"

          COMPOSE=(docker compose --env-file "${ENV_PATH}" -f docker-compose.yml -f "${COMPOSE_OVERRIDE}")

          set_image() {
            local image="$1"
            export IMAGE_NAME="${image}"
            if grep -qE '^IMAGE_NAME=' "${ENV_PATH}"; then
              sed -i "s|^IMAGE_NAME=.*|IMAGE_NAME=${image}|" "${ENV_PATH}"
            else
              printf '\nIMAGE_NAME=%s\n' "${image}" >> "${ENV_PATH}"
            fi
            printf 'IMAGE_NAME=%s\n' "${image}" > .env
          }

          rollback_app() {
            local reason="$1"
            echo "::error::${reason}"
            "${COMPOSE[@]}" logs --tail=100 api worker migrate || true
            if [ -z "${PREVIOUS_IMAGE}" ] || [ "${PREVIOUS_IMAGE}" = "${NEW_IMAGE}" ]; then
              echo "::error::No previous IMAGE_NAME available for automatic rollback"
              return 1
            fi
            echo "Rolling back application image to ${PREVIOUS_IMAGE} ..."
            set_image "${PREVIOUS_IMAGE}"
            "${COMPOSE[@]}" pull api worker
            "${COMPOSE[@]}" up -d --remove-orphans --wait --wait-timeout 120 api worker postgres-backup
            echo "Rollback complete (schema migrations are not reverted automatically)."
            return 1
          }

          verify_ready() {
            echo "Waiting for ${HEALTH_READY_URL} ..."
            for _ in $(seq 1 30); do
              if "${COMPOSE[@]}" exec -T api node -e "
                fetch(\"${HEALTH_READY_URL}\")
                  .then(async (r) => {
                    const body = await r.text();
                    if (!r.ok) { console.error(body); process.exit(1); }
                    console.log(body);
                  })
                  .catch((e) => { console.error(e); process.exit(1); });
              "; then
                return 0
              fi
              sleep 4
            done
            return 1
          }

          echo "Using IMAGE_NAME=${IMAGE_NAME}"
          "${COMPOSE[@]}" config --images

          "${COMPOSE[@]}" pull

          "${COMPOSE[@]}" up -d postgres redis
          "${COMPOSE[@]}" up -d --wait --wait-timeout 90 postgres redis

          if ! "${COMPOSE[@]}" run --rm migrate; then
            rollback_app "Database migration failed"
            exit 1
          fi

          if ! "${COMPOSE[@]}" up -d --remove-orphans --wait --wait-timeout 120 api worker postgres-backup; then
            rollback_app "Failed to start api/worker"
            exit 1
          fi

          if ! verify_ready; then
            rollback_app "Post-deploy HTTP health check failed (${HEALTH_READY_URL})"
            exit 1
          fi

          echo "Staging deploy OK — image=${NEW_IMAGE}"
          REMOTE
