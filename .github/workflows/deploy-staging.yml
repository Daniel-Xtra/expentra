name: Deploy Staging

on:
  push:
    branches:
      - staging
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read

env:
  COMPOSE_OVERRIDE: docker-compose.staging.yml
  ENV_FILE: .env.staging
  HEALTH_READY_URL: http://api:3200/api/health/ready

jobs:
  build-and-push:
    name: Build and push image
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 30
    outputs:
      # Tag only — never put DOCKERHUB_IMAGE in job outputs (secrets get redacted/empty).
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Image tag (immutable SHA)
        id: meta
        run: |
          SHA_TAG="sha-${GITHUB_SHA}"
          echo "tag=${SHA_TAG}" >> "$GITHUB_OUTPUT"
          echo "Building tag: ${SHA_TAG}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Tags are built in-shell so DOCKERHUB_IMAGE (secret or var) is never placed in GITHUB_OUTPUT.
      - name: Build and push
        env:
          IMAGE_REPOSITORY_SECRET: ${{ secrets.DOCKERHUB_IMAGE }}
          IMAGE_REPOSITORY_VAR: ${{ vars.DOCKERHUB_IMAGE }}
        run: |
          set -euo pipefail
          REPO="${IMAGE_REPOSITORY_SECRET:-$IMAGE_REPOSITORY_VAR}"
          if [ -z "${REPO}" ]; then
            echo "::error::Set DOCKERHUB_IMAGE as an Environment variable (recommended) or secret (e.g. youruser/expentra)"
            exit 1
          fi
          SHA_TAG="sha-${GITHUB_SHA}"
          echo "Building: ${REPO}:${SHA_TAG} and ${REPO}:staging"
          docker buildx build \
            --file Dockerfile \
            --tag "${REPO}:${SHA_TAG}" \
            --tag "${REPO}:staging" \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            --push \
            .

  deploy:
    name: Deploy to VPS
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Decode ENV_FILE_B64 and set IMAGE_NAME
        env:
          ENV_FILE_B64: ${{ secrets.ENV_FILE_B64 }}
          IMAGE_REPOSITORY_SECRET: ${{ secrets.DOCKERHUB_IMAGE }}
          IMAGE_REPOSITORY_VAR: ${{ vars.DOCKERHUB_IMAGE }}
        run: |
          set -euo pipefail
          if [ -z "${ENV_FILE_B64}" ]; then
            echo "::error::Missing environment secret ENV_FILE_B64 (base64-encoded .env file)"
            exit 1
          fi
          REPO="${IMAGE_REPOSITORY_SECRET:-$IMAGE_REPOSITORY_VAR}"
          if [ -z "${REPO}" ]; then
            echo "::error::DOCKERHUB_IMAGE is empty. Add it under Environment → Variables (preferred) or Secrets."
            exit 1
          fi
          IMAGE_NAME="${REPO}:sha-${GITHUB_SHA}"
          printf '%s' "${ENV_FILE_B64}" | base64 -d | tr -d '\r' > /tmp/expentra.env
          grep -qE '^[A-Za-z_][A-Za-z0-9_]*=' /tmp/expentra.env || {
            echo "::error::Decoded environment file is invalid."
            exit 1
          }
          # Drop any existing IMAGE_NAME lines, then append the new SHA tag once.
          grep -vE '^IMAGE_NAME=' /tmp/expentra.env > /tmp/expentra.env.clean || true
          printf 'IMAGE_NAME=%s\n' "${IMAGE_NAME}" >> /tmp/expentra.env.clean
          mv /tmp/expentra.env.clean /tmp/expentra.env
          grep -qE "^IMAGE_NAME=${IMAGE_NAME}$" /tmp/expentra.env
          printf '%s\n' "${IMAGE_NAME}" > /tmp/expentra.new-image
          echo "Deploy image: ${IMAGE_NAME}"

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Configure pinned known_hosts
        env:
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          if [ -z "${VPS_KNOWN_HOSTS}" ]; then
            echo "::error::Missing environment secret VPS_KNOWN_HOSTS (pinned ssh-keyscan output)"
            exit 1
          fi
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${VPS_KNOWN_HOSTS}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          printf '%s\n' \
            'Host *' \
            '  StrictHostKeyChecking yes' \
            '  UserKnownHostsFile ~/.ssh/known_hosts' \
            > ~/.ssh/config
          chmod 600 ~/.ssh/config

      - name: Capture previous running image
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          # Prefer the image actually running — env can be ahead of containers after a failed deploy.
          PREV="$(ssh "${VPS_USER}@${VPS_HOST}" \
            "docker inspect -f '{{.Config.Image}}' expentra-api 2>/dev/null || true")"
          if [ -z "${PREV}" ]; then
            PREV="$(ssh "${VPS_USER}@${VPS_HOST}" \
              "grep -E '^IMAGE_NAME=' '/opt/expentra-staging/env/${ENV_FILE}' 2>/dev/null | cut -d= -f2- || true")"
          fi
          printf '%s\n' "${PREV}" > /tmp/expentra.prev-image
          echo "Previous running IMAGE_NAME=${PREV:-<none>}"

      - name: Sync deploy files and env to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          ssh "${VPS_USER}@${VPS_HOST}" "mkdir -p '/opt/expentra-staging/compose' '/opt/expentra-staging/env' '/opt/expentra-staging/scripts' '/opt/expentra-staging/certs/postgres'"
          # Do not delete compose/.env — CI rewrites it in the deploy step.
          rsync -az --delete --exclude .env \
            deploy/compose/ \
            "${VPS_USER}@${VPS_HOST}:/opt/expentra-staging/compose/"
          rsync -az --delete \
            deploy/scripts/ \
            "${VPS_USER}@${VPS_HOST}:/opt/expentra-staging/scripts/"
          scp /tmp/expentra.env "${VPS_USER}@${VPS_HOST}:/opt/expentra-staging/env/${ENV_FILE}"
          scp /tmp/expentra.new-image "${VPS_USER}@${VPS_HOST}:/opt/expentra-staging/env/.image-name"
          if [ -f /tmp/expentra.prev-image ]; then
            scp /tmp/expentra.prev-image "${VPS_USER}@${VPS_HOST}:/opt/expentra-staging/env/.image-name.prev"
          else
            ssh "${VPS_USER}@${VPS_HOST}" "rm -f '/opt/expentra-staging/env/.image-name.prev'"
          fi
          ssh "${VPS_USER}@${VPS_HOST}" \
            "chmod 600 '/opt/expentra-staging/env/${ENV_FILE}' '/opt/expentra-staging/env/.image-name'"

      - name: Pull, migrate, restart, verify health
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          GIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          echo "Expected image tag: sha-${GIT_SHA}"

          ssh "${VPS_USER}@${VPS_HOST}" \
            COMPOSE_OVERRIDE="$COMPOSE_OVERRIDE" \
            ENV_FILE="$ENV_FILE" \
            HEALTH_READY_URL="$HEALTH_READY_URL" \
            DOCKERHUB_USERNAME="$DOCKERHUB_USERNAME" \
            DOCKERHUB_TOKEN="$DOCKERHUB_TOKEN" \
            GIT_SHA="$GIT_SHA" \
            'bash -s' <<'REMOTE'
          set -euo pipefail

          cd /opt/expentra-staging/compose
          ENV_PATH="../env/${ENV_FILE}"
          IMAGE_FILE="../env/.image-name"
          PREV_FILE="../env/.image-name.prev"
          CERT_DIR="../certs/postgres"

          if [ ! -s "${IMAGE_FILE}" ]; then
            echo "::error::Missing ${IMAGE_FILE} — sync step did not write the new image name"
            exit 1
          fi

          NEW_IMAGE="$(tr -d '\r\n' < "${IMAGE_FILE}")"
          PREVIOUS_IMAGE=""
          if [ -s "${PREV_FILE}" ]; then
            PREVIOUS_IMAGE="$(tr -d '\r\n' < "${PREV_FILE}")"
          fi

          if [ -z "${NEW_IMAGE}" ]; then
            echo "::error::NEW_IMAGE is empty — cannot deploy"
            exit 1
          fi
          case "${NEW_IMAGE}" in
            *:sha-"${GIT_SHA}") ;;
            *)
              echo "::error::Image file ${NEW_IMAGE} does not match commit sha-${GIT_SHA}"
              exit 1
              ;;
          esac

          echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin

          # Ensure Postgres TLS material exists (Compose mounts this path).
          mkdir -p "${CERT_DIR}"
          if [ ! -s "${CERT_DIR}/server.crt" ] || [ ! -s "${CERT_DIR}/server.key" ] || [ ! -s "${CERT_DIR}/ca.crt" ]; then
            echo "Postgres TLS certs missing — generating..."
            sh "../scripts/postgres-tls/generate-certs.sh" "${CERT_DIR}"
          fi
          docker run --rm \
            -v "$(CDPATH= cd -- "${CERT_DIR}" && pwd):/certs" \
            alpine:3.20 \
            sh -c 'chown -R 70:70 /certs && chmod 600 /certs/server.key /certs/ca.key && chmod 644 /certs/server.crt /certs/ca.crt'

          COMPOSE=(docker compose -f docker-compose.yml -f "${COMPOSE_OVERRIDE}")
          APP_RECREATED=0

          set_image() {
            local image="$1"
            export IMAGE_NAME="${image}"
            grep -vE '^IMAGE_NAME=' "${ENV_PATH}" > "${ENV_PATH}.tmp" || true
            printf 'IMAGE_NAME=%s\n' "${image}" >> "${ENV_PATH}.tmp"
            mv "${ENV_PATH}.tmp" "${ENV_PATH}"
            printf 'IMAGE_NAME=%s\n' "${image}" > .env
            printf '%s\n' "${image}" > "${IMAGE_FILE}"
            chmod 600 .env "${ENV_PATH}" "${IMAGE_FILE}"
          }

          running_api_image() {
            docker inspect -f '{{.Config.Image}}' expentra-api 2>/dev/null || true
          }

          # If a previous deploy left env ahead of containers, do not leave that drift.
          revert_env_to_running() {
            local running
            running="$(running_api_image)"
            if [ -n "${running}" ]; then
              echo "Reverting env IMAGE_NAME to running container: ${running}"
              set_image "${running}"
            elif [ -n "${PREVIOUS_IMAGE}" ]; then
              echo "Reverting env IMAGE_NAME to previous: ${PREVIOUS_IMAGE}"
              set_image "${PREVIOUS_IMAGE}"
            fi
          }

          assert_compose_image() {
            local expected="$1"
            echo "Compose resolved images:"
            "${COMPOSE[@]}" config --images
            if ! "${COMPOSE[@]}" config --images | grep -qxF "${expected}"; then
              echo "::error::Compose did not resolve IMAGE_NAME to ${expected}"
              echo "shell IMAGE_NAME=${IMAGE_NAME:-<unset>}"
              echo "compose/.env: $(cat .env 2>/dev/null || true)"
              return 1
            fi
          }

          recreate_app() {
            local image="$1"
            set_image "${image}"
            assert_compose_image "${image}"
            echo "Pulling and recreating api/worker → ${image}"
            docker pull "${image}"
            docker rm -f expentra-api expentra-worker 2>/dev/null || true
            IMAGE_NAME="${image}" "${COMPOSE[@]}" pull api worker
            IMAGE_NAME="${image}" "${COMPOSE[@]}" up -d --force-recreate --pull always --remove-orphans --wait --wait-timeout 120 api worker postgres-backup
            APP_RECREATED=1
            local running
            running="$(running_api_image)"
            if [ "${running}" != "${image}" ]; then
              echo "::error::After recreate, api is ${running:-<none>}, expected ${image}"
              return 1
            fi
            echo "api/worker now running: ${running}"
          }

          fail_before_recreate() {
            local reason="$1"
            echo "::error::${reason}"
            "${COMPOSE[@]}" logs --tail=80 migrate postgres || true
            revert_env_to_running
            echo "Env restored to match running containers (no manual IMAGE_NAME fix needed)."
            exit 1
          }

          fail_after_recreate() {
            local reason="$1"
            echo "::error::${reason}"
            echo "::error::api/worker already on ${NEW_IMAGE} — not rolling back."
            "${COMPOSE[@]}" logs --tail=100 api worker || true
            docker ps -a --filter name=expentra --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}' || true
            exit 1
          }

          verify_ready() {
            echo "Waiting for ${HEALTH_READY_URL} ..."
            for _ in $(seq 1 30); do
              if "${COMPOSE[@]}" exec -T api node -e "
                fetch(\"${HEALTH_READY_URL}\")
                  .then(async (r) => {
                    const body = await r.text();
                    if (!r.ok) { console.error(body); process.exit(1); }
                    console.log(body);
                  })
                  .catch((e) => { console.error(e); process.exit(1); });
              "; then
                return 0
              fi
              sleep 4
            done
            return 1
          }

          echo "Target IMAGE_NAME=${NEW_IMAGE}"
          echo "Previous IMAGE_NAME=${PREVIOUS_IMAGE:-<none>}"
          echo "Currently running: $(running_api_image)"

          set_image "${NEW_IMAGE}"
          assert_compose_image "${NEW_IMAGE}" || fail_before_recreate "Compose image interpolation failed"

          echo "Pulling ${NEW_IMAGE} ..."
          docker pull "${NEW_IMAGE}"
          "${COMPOSE[@]}" pull migrate

          "${COMPOSE[@]}" up -d postgres redis
          if ! "${COMPOSE[@]}" up -d --wait --wait-timeout 90 postgres redis; then
            fail_before_recreate "Postgres/Redis failed to become healthy"
          fi

          if ! "${COMPOSE[@]}" run --rm migrate; then
            fail_before_recreate "Database migration failed"
          fi

          # Always recreate app to match env — this is what was skipped when migrate failed earlier.
          if ! recreate_app "${NEW_IMAGE}"; then
            fail_after_recreate "Failed to recreate api/worker on ${NEW_IMAGE}"
          fi

          if ! verify_ready; then
            fail_after_recreate "Post-deploy HTTP health check failed (${HEALTH_READY_URL})"
          fi

          echo "Running containers:"
          docker ps --filter name=expentra-api --filter name=expentra-worker --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}'
          echo "Staging deploy OK — image=${NEW_IMAGE}"
          REMOTE
