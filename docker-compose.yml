name: expentra

networks:
  backend:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  postgres_backups:

services:
  postgres:
    image: postgres:15-alpine
    container_name: expentra-postgres

    restart: unless-stopped

    env_file:
      - .env

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

    networks:
      - backend

  redis:
    image: redis:7-alpine
    container_name: expentra-redis

    restart: unless-stopped

    command: redis-server --appendonly yes

    volumes:
      - redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

    networks:
      - backend

  postgres-backup:
    image: postgres:15-alpine
    container_name: expentra-postgres-backup

    restart: unless-stopped

    env_file:
      - .env

    environment:
      POSTGRES_HOST: postgres
      BACKUP_DIR: /backups
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}

    volumes:
      - ./infra/backup:/scripts:ro
      - postgres_backups:/backups

    entrypoint: ["/bin/sh", "-c"]

    command: |
      set -eu
      mkdir -p /runtime
      sed 's/\r$$//' /scripts/backup.sh > /runtime/backup.sh
      sed 's/\r$$//' /scripts/restore.sh > /runtime/restore.sh
      sed 's/\r$$//' /scripts/entrypoint.sh > /runtime/entrypoint.sh
      chmod +x /runtime/*.sh
      exec /bin/sh /runtime/entrypoint.sh

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - backend