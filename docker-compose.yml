name: expentra

networks:
  backend:
    driver: bridge

services:
  api:
    container_name: expentra-api

    build:
      context: .
      dockerfile: Dockerfile
      target: deps

    working_dir: /app

    command: sh -c "pnpm install && pnpm run start:dev"

    ports:
      - '${PORT:-3200}:3200'

    env_file:
      - .env

    volumes:
      - .:/app
      - /app/node_modules

    depends_on:
      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy

    restart: unless-stopped

    networks:
      - backend

  postgres:
    container_name: expentra-postgres

    image: postgres:15-alpine

    restart: unless-stopped

    env_file:
      - .env

    ports:
      - '${POSTGRES_PORT:-5432}:5432'

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']

      interval: 5s
      timeout: 5s
      retries: 10

    networks:
      - backend

  redis:
    container_name: expentra-redis

    image: redis:7-alpine

    restart: unless-stopped

    command: redis-server --appendonly yes

    ports:
      - '${REDIS_PORT:-6379}:6379'

    volumes:
      - redis_data:/data

    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']

      interval: 5s
      timeout: 3s
      retries: 10

    networks:
      - backend

volumes:
  postgres_data:
  redis_data:
