services:
  api:
    container_name: expentra-api

    image: docker.io/YOUR_DOCKERHUB_USERNAME/expentra-api:develop

    restart: unless-stopped

    env_file:
      - .env

    environment:
      RUN_MIGRATIONS: "true"

    expose:
      - "3200"

    depends_on:
      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3200/api/health/live').then(()=>process.exit(0)).catch(()=>process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      retries: 3

    networks:
      - backend

  worker:
    container_name: expentra-worker

    image: docker.io/YOUR_DOCKERHUB_USERNAME/expentra-api:develop

    restart: unless-stopped

    command: ["node", "dist/worker.js"]

    env_file:
      - .env

    environment:
      RUN_MIGRATIONS: "false"
      RUN_SEED: "false"

    depends_on:
      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy

    healthcheck:
      disable: true

    networks:
      - backend
