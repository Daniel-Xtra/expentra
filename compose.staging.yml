name: expentra-staging

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-app: &app
  image: ${IMAGE_NAME}
  pull_policy: always
  env_file:
    - .env
  environment: &app-env
    PORT: "3200"
    POSTGRES_HOST: postgres
    POSTGRES_SSL: "false"
    REDIS_HOST: redis
    REDIS_PORT: "6379"
    REDIS_URL: redis://redis:6379
    REDIS_DISABLE_SSL: "true"
  networks:
    - backend
  logging: *default-logging

networks:
  backend:
    driver: bridge

volumes:
  postgres_data:
  redis_data:

services:
  postgres:
    image: postgres:15-alpine
    container_name: expentra-staging-postgres
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend

  redis:
    image: redis:7-alpine
    container_name: expentra-staging-redis
    restart: unless-stopped
    logging: *default-logging
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - backend

  api:
    <<: *app
    container_name: expentra-staging-api
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      <<: *app-env
      APP_ROLE: api
      RUN_MIGRATIONS: "true"
      RUN_SEED: "false"
    ports:
      - "127.0.0.1:3201:3200"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3200/api/health/live').then(()=>process.exit(0)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  worker:
    <<: *app
    container_name: expentra-staging-worker
    restart: unless-stopped
    stop_grace_period: 30s
    command: ["node", "dist/worker.js"]
    environment:
      <<: *app-env
      APP_ROLE: worker
      RUN_MIGRATIONS: "false"
      RUN_SEED: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"const Redis=require('ioredis'); const u=process.env.REDIS_URL; if(!u) process.exit(1); const r=new Redis(u,{maxRetriesPerRequest:1,connectTimeout:3000,lazyConnect:true}); r.connect().then(()=>r.ping()).then((p)=>{r.disconnect(); process.exit(p==='PONG'?0:1);}).catch(()=>process.exit(1));\"",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
